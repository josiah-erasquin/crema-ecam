<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#201813">
<title>Crema — ECAM 23.460.S Barista</title>
<meta name="description" content="A pocket barista for the De'Longhi ECAM 23.460.S: recipes, how-to, and care, offline.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crema">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Spline+Sans+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3EEE4;
  --panel:#EAE2D3;
  --ink:#201813;
  --ink-soft:#5A4C42;
  --accent:#C8892B;
  --accent-ink:#8A5717;
  --line:#B9AC97;
  --line-soft:#D8CFBD;
  --on-ink:#F3EEE4;
  --on-ink-soft:#C9BCA9;
  --good:#3E6E4E;
  --sans:"Hanken Grotesk",system-ui,sans-serif;
  --mono:"Spline Sans Mono",ui-monospace,monospace;
  --header-h:56px;
  --nav-h:64px;
  --maxw:560px;
  --r:14px;
  --shadow:0 6px 20px -8px rgba(32,24,19,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
::selection{background:var(--accent);color:var(--ink)}
:focus-visible{outline:2.5px solid var(--accent-ink);outline-offset:2px;border-radius:3px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--accent-ink);text-underline-offset:3px}
/* scrollbar */
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px;border:2px solid var(--paper)}

.app{max-width:var(--maxw);margin:0 auto;min-height:100vh;min-height:100dvh;position:relative}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:40;
  background:var(--ink);color:var(--on-ink);
  height:calc(var(--header-h) + env(safe-area-inset-top));
  padding-top:env(safe-area-inset-top);
  display:flex;align-items:center;gap:12px;padding-left:16px;padding-right:12px;
  box-shadow:var(--shadow);
}
header .brand{display:flex;align-items:baseline;gap:9px;font-weight:800;letter-spacing:-.02em;font-size:20px}
header .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);align-self:center;flex:0 0 auto}
header .brand small{font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--on-ink-soft)}
header .sp{flex:1}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--on-ink)}
.iconbtn:hover{background:rgba(243,238,228,.1)}
header .back{display:none}
body[data-view="detail"] header .back{display:grid}
body[data-view="detail"] header .brand{display:none}
header .crumb{display:none;font-weight:700;font-size:17px;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body[data-view="detail"] header .crumb{display:block}

/* ---------- scroll region ---------- */
main{padding:0 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 28px);}
.pad-top{height:18px}

/* search */
.search{position:relative;margin:14px 0 6px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-soft)}
.search input{
  width:100%;height:48px;border-radius:12px;border:1.5px solid var(--line);
  background:#FBF8F1;padding:0 40px 0 44px;font:inherit;color:var(--ink);
}
.search input::placeholder{color:var(--ink-soft)}
.search input{caret-color:var(--accent-ink)}
.search input:focus{border-color:var(--accent-ink);outline:none;background:#fff}
.search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:32px;height:32px;border-radius:8px;display:none;place-items:center;color:var(--ink-soft)}
.search.has-val .clr{display:grid}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0 12px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;height:36px;padding:0 15px;border-radius:999px;border:1.5px solid var(--line);
  background:transparent;color:var(--ink-soft);font-weight:600;font-size:14px;letter-spacing:.01em;white-space:nowrap;
  transition:background .15s,color .15s,border-color .15s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}

/* section label */
.sec{display:flex;align-items:center;gap:12px;margin:22px 2px 12px}
.sec h2{margin:0;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
.sec .rule{flex:1;height:1px;background:var(--line)}
.sec .count{font-family:var(--mono);font-size:12px;color:var(--ink-soft)}

/* ---------- recipe cards ---------- */
.deck{display:flex;flex-direction:column;gap:12px}
.card{
  position:relative;display:block;width:100%;text-align:left;
  background:#FBF8F1;border:1.5px solid var(--line-soft);border-radius:var(--r);
  padding:15px 16px 14px;overflow:hidden;
  transition:transform .12s ease,border-color .15s;
}
.card:active{transform:scale(.988)}
.card:hover{border-color:var(--line)}
.card .top{display:flex;align-items:flex-start;gap:12px}
.card .name{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.12;margin:0}
.card .orig{font-family:var(--mono);font-size:11px;color:var(--ink-soft);margin-top:3px;letter-spacing:.02em}
.card .arr{margin-left:auto;color:var(--line);flex:0 0 auto;margin-top:2px}
.card .desc{margin:7px 0 0;font-size:14.5px;color:var(--ink-soft);line-height:1.4}
.spec{display:flex;gap:0;margin-top:13px;border:1.4px solid var(--line-soft);border-radius:10px;overflow:hidden;background:var(--panel)}
.spec .cell{flex:1;padding:8px 10px 9px;min-width:0}
.spec .cell + .cell{border-left:1.4px solid var(--line-soft)}
.spec .k{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft)}
.spec .v{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--ink);margin-top:3px;line-height:1.3;
  overflow-wrap:break-word;hyphens:auto}
.spec .v.acc{color:var(--accent-ink)}

/* empty / no result */
.empty{padding:48px 20px;text-align:center;color:var(--ink-soft)}
.empty svg{color:var(--line);margin-bottom:10px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

/* ---------- detail ---------- */
.detail{padding-top:16px}
.namecard{background:var(--ink);color:var(--on-ink);border-radius:16px;padding:20px 20px 18px;box-shadow:var(--shadow)}
.namecard .tagline{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.namecard h1{margin:8px 0 0;font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.namecard p{margin:9px 0 0;color:var(--on-ink-soft);font-size:15px;line-height:1.45}
.dspec{display:flex;margin-top:16px;border-top:1px solid rgba(243,238,228,.16);padding-top:14px;gap:0}
.dspec .cell{flex:1;padding:0 10px;min-width:0}
.dspec .cell:first-child{padding-left:0}
.dspec .cell + .cell{border-left:1px solid rgba(243,238,228,.16)}
.dspec .k{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--on-ink-soft)}
.dspec .v{font-family:var(--mono);font-size:14px;font-weight:600;margin-top:4px;line-height:1.3}
.dspec .v.acc{color:var(--accent)}

.block{margin-top:26px}
.block > h3{margin:0 0 13px;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}

/* steps */
ol.steps{list-style:none;margin:0;padding:0;counter-reset:s}
ol.steps li{position:relative;display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line-soft);cursor:pointer}
ol.steps li:last-child{border-bottom:none}
ol.steps li .num{counter-increment:s;flex:0 0 auto;width:28px;height:28px;border-radius:50%;
  border:1.6px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink-soft);
  transition:background .15s,border-color .15s,color .15s}
ol.steps li .num::before{content:counter(s)}
ol.steps li .txt{padding-top:2px;font-size:15.5px;line-height:1.5}
ol.steps li[data-done="1"] .num{background:var(--accent);border-color:var(--accent);color:var(--ink)}
ol.steps li[data-done="1"] .num::before{content:"";width:9px;height:5px;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(-45deg) translate(0,-1px)}
ol.steps li[data-done="1"] .txt{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--line)}
ol.steps li b{font-weight:700}
ol.steps li code{font-family:var(--mono);font-size:13.5px;background:var(--panel);padding:1px 6px;border-radius:5px}

/* stamp */
.stamp{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;padding:4px 9px;border-radius:6px;border:1.4px solid currentColor}
.stamp.official{color:var(--accent-ink)}
.stamp.tip{color:var(--ink-soft)}
.stamprow{display:flex;align-items:center;gap:10px;margin:2px 0 4px}

/* mug-size toggle */
.seg{display:flex;gap:6px;background:var(--panel);border:1.4px solid var(--line-soft);border-radius:12px;padding:5px}
.seg-btn{flex:1;height:40px;border-radius:9px;font-weight:600;font-size:14px;color:var(--ink-soft);transition:background .15s,color .15s}
.seg-btn.on{background:var(--ink);color:var(--on-ink)}
.sizebuild{display:none;margin-top:12px;background:#FBF8F1;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px}
.sizebuild.show{display:block}
.sizehead{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink)}
.sizebuild p{margin:7px 0 0;font-size:15px;line-height:1.5}
.sizebuild p b{font-weight:700}
.sizefoot{margin-top:10px;padding-top:9px;border-top:1px solid var(--line-soft);font-size:12.5px;color:var(--ink-soft)}

.callout{background:var(--panel);border:1.4px solid var(--line-soft);border-radius:12px;padding:13px 15px;margin-top:6px}
.callout .stamprow{margin-top:0}
.callout p{margin:6px 0 0;font-size:14.5px;line-height:1.5;color:var(--ink)}

.source{display:flex;align-items:center;gap:11px;margin-top:8px;padding:13px 15px;border:1.5px solid var(--line);border-radius:12px;
  background:#FBF8F1;color:var(--ink);font-weight:600;font-size:14px}
.source svg{flex:0 0 auto;color:var(--accent-ink)}
.source .m{min-width:0}
.source .m .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.source .m .u{font-family:var(--mono);font-size:11px;color:var(--ink-soft);font-weight:500}
.source .arr{margin-left:auto;color:var(--line)}

/* guide/care list rows */
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#FBF8F1;
  border:1.5px solid var(--line-soft);border-radius:var(--r);padding:15px 16px;transition:transform .12s,border-color .15s}
.row:active{transform:scale(.99)}
.row .ic{flex:0 0 auto;width:38px;height:38px;border-radius:10px;background:var(--panel);display:grid;place-items:center;color:var(--ink)}
.row .m{min-width:0}
.row .m .t{font-size:16.5px;font-weight:700;letter-spacing:-.01em}
.row .m .d{font-size:13.5px;color:var(--ink-soft);margin-top:2px}
.row .arr{margin-left:auto;color:var(--line);flex:0 0 auto}

.note{font-size:13px;color:var(--ink-soft);margin:18px 2px 0;line-height:1.5}
.note b{color:var(--ink)}

/* ---------- bottom nav ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--ink);color:var(--on-ink-soft);
  height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  display:flex;max-width:var(--maxw);margin:0 auto;
  box-shadow:0 -6px 20px -10px rgba(32,24,19,.5);
}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:11px;font-weight:600;letter-spacing:.03em;color:var(--on-ink-soft);position:relative}
nav button .g{width:24px;height:24px}
nav button[aria-current="page"]{color:var(--on-ink)}
nav button[aria-current="page"]::before{content:"";position:absolute;top:0;width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}

/* view switching */
.view{display:none}
body[data-view="recipes"] #view-recipes{display:block}
body[data-view="detail"] #view-detail{display:block}
body[data-view="guide"] #view-guide{display:block}
body[data-view="care"] #view-care{display:block}

/* entrance: settle from an already-visible default */
@media (prefers-reduced-motion:no-preference){
  .stagger>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
  .stagger>*:nth-child(2){animation-delay:.03s}
  .stagger>*:nth-child(3){animation-delay:.06s}
  .stagger>*:nth-child(4){animation-delay:.09s}
  .stagger>*:nth-child(5){animation-delay:.12s}
  .stagger>*:nth-child(n+6){animation-delay:.15s}
  @keyframes rise{from{opacity:.001;transform:translateY(9px)}to{opacity:1;transform:none}}
  .detail{animation:slideup .34s cubic-bezier(.2,.7,.2,1) both}
  @keyframes slideup{from{opacity:.001;transform:translateY(14px)}to{opacity:1;transform:none}}
}
.install{position:fixed;left:16px;right:16px;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);
  max-width:calc(var(--maxw) - 32px);margin:0 auto;z-index:50;background:var(--ink);color:var(--on-ink);
  border-radius:14px;padding:13px 14px;display:none;align-items:center;gap:12px;box-shadow:var(--shadow)}
.install.show{display:flex}
.install .m{min-width:0;font-size:13.5px;line-height:1.35}
.install .m b{font-weight:700}
.install button.go{flex:0 0 auto;background:var(--accent);color:var(--ink);font-weight:700;border-radius:9px;padding:9px 14px;font-size:13.5px}
.install button.x{flex:0 0 auto;color:var(--on-ink-soft);width:30px;height:30px;display:grid;place-items:center}
</style>
</head>
<body data-view="recipes">
<div class="app">
  <header>
    <button class="iconbtn back" aria-label="Back" onclick="history.back()">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 19l-7-7 7-7"/></svg>
    </button>
    <div class="brand"><span class="dot"></span><span>Crema</span><small>ECAM 23.460.S</small></div>
    <div class="crumb" id="crumb"></div>
    <div class="sp"></div>
  </header>

  <main>
    <!-- RECIPES -->
    <section class="view" id="view-recipes">
      <div class="search" id="searchwrap">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="search" type="search" placeholder="Search drinks…" autocomplete="off" aria-label="Search drinks">
        <button class="clr" id="clr" aria-label="Clear search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="chips" id="chips" role="tablist"></div>
      <div id="recipe-list"></div>
    </section>

    <!-- DETAIL -->
    <section class="view" id="view-detail"><div id="detail"></div></section>

    <!-- GUIDE -->
    <section class="view" id="view-guide">
      <div class="pad-top"></div>
      <div id="guide-body"></div>
    </section>

    <!-- CARE -->
    <section class="view" id="view-care">
      <div class="pad-top"></div>
      <div id="care-body"></div>
    </section>
  </main>

  <nav>
    <button data-tab="recipes" aria-current="page" onclick="go('#recipes')">
      <svg class="g" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13a3 3 0 0 1 0 6h-1"/><path d="M4 8v6a5 5 0 0 0 5 5h3a5 5 0 0 0 5-5V8z"/><path d="M8 2c-.5 1 .5 1.5 0 2.5M12 2c-.5 1 .5 1.5 0 2.5"/></svg>
      Recipes
    </button>
    <button data-tab="guide" onclick="go('#guide')">
      <svg class="g" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H19v3H6.5A2.5 2.5 0 0 1 4 20.5z"/><path d="M8 7.5h7M8 10.5h7"/></svg>
      How-to
    </button>
    <button data-tab="care" onclick="go('#care')">
      <svg class="g" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s5 3 5 8a5 5 0 0 1-10 0c0-2 1-3.5 2-5"/><path d="M9.5 20.5h5"/></svg>
      Care
    </button>
  </nav>

  <div class="install" id="install">
    <div class="m"><b>Install Crema</b> — add it to your home screen for offline use.</div>
    <button class="go" id="install-go">Install</button>
    <button class="x" id="install-x" aria-label="Dismiss">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
</body>
</html>
