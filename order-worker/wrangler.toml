name = "crema-orders"
main = "worker.js"
compatibility_date = "2024-09-23"

# setup.sh fills the KV id and the VAPID public key below.
kv_namespaces = [{ binding = "CREMA", id = "PUT_KV_ID_HERE" }]

[vars]
VAPID_SUBJECT = "mailto:jo@weandgoliath.com"
VAPID_PUBLIC = "PUT_VAPID_PUBLIC_HERE"

# VAPID_PRIVATE is a secret, set with: wrangler secret put VAPID_PRIVATE
